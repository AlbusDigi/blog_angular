<header class="w-full bg-white shadow-md">
  <div class="max-w-7xl mx-auto flex items-center justify-between p-4">

    <div class="flex items-center">
      <img src="https://cdn4.iconfinder.com/data/icons/logos-and-brands/512/21_Angular_logo_logos-512.png"
        alt="Angular Logo" class="w-14 h-14">
    </div>

    <div class="mt-4 flex justify-end relative">
      <div class="flex w-full lg:max-w-[500px] rounded-full border border-gray-400 bg-gray-100 px-3 cursor-pointer"
        (click)="isModalOpen = true">
        <input type="text" class="w-full bg-transparent px-3 py-2 text-gray-700 outline-none cursor-pointer"
          placeholder="Rechercher un article" readonly />
        <button type="button" class="rounded-full bg-transparent px-2 py-2">
          <svg class="size-6" viewBox="0 0 24 24" fill="none">
            <path d="M14.95 14.95L21 21M17 10A7 7 0 1 1 3 10a7 7 0 0 1 14 0Z" stroke="#999" stroke-width="1.5"
              stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
      </div>
    </div>

   
    <div *ngIf="isModalOpen"
      class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-white bg-opacity-80 backdrop-blur-sm px-4">
      
      <h1 class="text-4xl md:text-5xl font-semibold text-gray-800 mb-6 text-center tracking-tight">
        Rechercher un article
      </h1>

     
      <div class="bg-white w-full max-w-xl rounded-xl shadow-lg p-6 relative">
        <button (click)="isModalOpen = false"
          class="absolute top-2 right-2 text-gray-600 hover:text-black text-2xl">×</button>

      
        <div class="flex w-full rounded-full border border-gray-300 bg-gray-100 px-3">
          <input #searchInput type="text" class="w-full bg-transparent px-3 py-2 text-gray-700 outline-none"
            placeholder="Rechercher un article" [(ngModel)]="searchQuery" (keyup.enter)="onSearch()" />
          <button class="rounded-full px-2 py-2" (click)="onSearch()">
            <svg class="size-6" viewBox="0 0 24 24" fill="none">
              <path d="M14.95 14.95L21 21M17 10A7 7 0 1 1 3 10a7 7 0 0 1 14 0Z" stroke="#999" stroke-width="1.5"
                stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
        </div>

       
        <div *ngIf="isLoading" class="mt-4 text-center text-gray-500">
          Chargement des résultats...
        </div>

        <div *ngIf="searchResults.length > 0 && !isLoading"
          class="mt-4 max-h-[300px] overflow-y-auto border border-gray-300 shadow rounded-lg">
          <ul>
            <a *ngFor="let article of searchResults" [routerLink]="['/article', article.id]"
              class="block hover:bg-gray-100 border-b last:border-b-0 px-4 py-2">
              <div class="flex items-center space-x-4">
                <img [src]="article.photo" class="w-16 h-16 object-cover rounded-lg" />
                <span class="text-gray-800 hover:text-red-500 flex-1">
                  {{ article.title }}
                </span>
              </div>
            </a>
          </ul>
        </div>

       
        <div *ngIf="hasError && !isLoading" class="mt-4 text-center text-red-600 font-medium">
          Une erreur est survenue pendant la recherche. Veuillez réessayer.
        </div>

       
        <div *ngIf="searchResults.length === 0 && searchQuery && !isLoading && !hasError"
          class="mt-4 text-center text-gray-500 italic">
          Aucun article trouvé.
        </div>
      </div>
    </div>





    <nav *ngIf="isConnected">
      <ul class="flex space-x-8">
        <li>
          <a [routerLink]="['']" class="text-gray-700 hover:text-red-500 transition font-medium">
            Home
          </a>
        </li>
        <li>
          <a [routerLink]="['/articles']" class="text-gray-700 hover:text-red-500 transition font-medium">
            Articles
          </a>
        </li>
        <li>
          <a [routerLink]="['/categories']" class="text-gray-700 hover:text-red-500 transition font-medium">
            Catégories
          </a>
        </li>
        <li>
          <a [routerLink]="['/tags']" class="text-gray-700 hover:text-red-500 transition font-medium">
            Tags
          </a>
        </li>
        <li>
          <a (click)="deconnexion()"
            class="text-white bg-blue-700  focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-4 py-2 md:px-5 md:py-2.5 dark:bg-red-600 focus:outline-none dark:focus:ring-blue-800">
            Déconnexion
          </a>
        </li>
        <li>
          <button class="text-gray-700 hover:text-red-500 transition font-medium">{{name}}</button>
        </li>
      </ul>
    </nav>
    <nav *ngIf="!isConnected">
      <ul class="flex space-x-8">
        <li>
          <a [routerLink]="['']" class="text-gray-700 hover:text-red-500 transition font-medium">
            Home
          </a>
        </li>
        <li>
          <a [routerLink]="['/articles']" class="text-gray-700 hover:text-red-500 transition font-medium">
            Articles
          </a>
        </li>
        <li>
          <a [routerLink]="['/login']"
            class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-4 py-2 md:px-5 md:py-2.5 dark:bg-blue-600 dark:hover:bg-blue-700 focus:outline-none dark:focus:ring-blue-800">
            Login
          </a>
        </li>
        <li>
          <a [routerLink]="['/register']"
            class="text-white bg-blue-700  focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-4 py-2 md:px-5 md:py-2.5 dark:bg-red-600 focus:outline-none dark:focus:ring-blue-800">
            Register
          </a>
        </li>
      </ul>
    </nav>

  </div>
</header>
